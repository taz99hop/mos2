<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIMARS Tactical Console</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="panel" class="hidden">
    <div class="topbar">
      <span>TACTICAL FIRE CONTROL</span>
      <button id="closeBtn">×</button>
    </div>

    <div class="grid"></div>

    <div class="content">
      <h1>منصة الإطلاق M142</h1>
      <p class="sub">واجهة قتالية قديمة - QBCore</p>

      <div class="status">
        <div><b>Cooldown:</b> <span id="cooldown">0</span>s</div>
        <div id="targetState" class="warn">لا يوجد هدف محدد</div>
      </div>

      <label>عدد الصواريخ</label>
      <input id="missileCount" type="number" min="1" max="12" value="6" />

      <div class="actions">
        <button id="pickBtn" class="secondary">تثبيت الهدف من الـ Waypoint</button>
        <button id="launchBtn" class="danger">إطلاق الرشقة</button>
      </div>

      <pre id="targetInfo">---</pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
